<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Add Student</h2>

    <form th:action="@{/employe}" th:object="${employe}" method="post">

        <div class="mb-3">

            <label>Name</label>

            <input type="text"
                   th:field="*{name}"
                   class="form-control">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>
        </div>

        <div class="mb-3">

            <label>Designation</label>

            <input type="text"
                   th:field="*{designation}"
                   class="form-control">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('designation')}"
                 th:errors="*{designation}">
            </div>

        </div>


        <div class="mb-3">

            <label>Email</label>

            <input type="email"
                   th:field="*{email}"
                   class="form-control">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>
        </div>

        <div class="mb-3">

            <label>Salary</label>

            <input type="text"
                   th:field="*{salary}"
                   class="form-control">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('salary')}"
                 th:errors="*{salary}">
            </div>
        </div>

        <button type="submit" class="btn btn-success">
            Save Employee
        </button>

    </form>

</div>

</body>
</html>
