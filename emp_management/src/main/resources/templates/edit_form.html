<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Edit Student</h2>

    <form th:action="@{/employe/{id}(id=${employe.id})}"
          th:object="${employe}"
          method="post">

        <div class="mb-3">

            <label>Name</label>

            <input type="text"
                   th:field="*{name}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label>Email</label>

            <input type="email"
                   th:field="*{email}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label>Designation</label>

            <input type="text"
                   th:field="*{designation}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label>Salary</label>

            <input type="text"
                   th:field="*{salary}"
                   class="form-control">

        </div>

        <button type="submit" class="btn btn-success">
            Update Employe
        </button>

    </form>

</div>

</body>
</html>
