<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Employee List</h2>
    <form th:action="@{/search}" method="get">

        <input type="text"
               name="keyword"
               placeholder="Search employee name">

        <button type="submit">
            Search
        </button>

    </form>
    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Designation</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="employe : ${employes}">

            <td th:text="${employe.id}"></td>

            <td th:text="${employe.name}"></td>
            <td th:text="${employe.email}"></td>

            <td th:text="${employe.designation}"></td>

            <td th:text="${employe.salary}"></td>

            <td>

                <a th:href="@{/employe/edit/{id}(id=${employe.id})}"
                   class="btn btn-warning btn-sm">

                    Edit

                </a>

                <a th:href="@{/employe/delete/{id}(id=${employe.id})}"
                   class="btn btn-danger btn-sm">

                    Delete

                </a>

            </td>


        </tr>

        </tbody>

    </table>
    <div>

        <a th:if="${currentPage > 1}"
           th:href="@{/(page=${currentPage - 1})}">
            Previous
        </a>

        <span th:text="${currentPage}"></span>

        <a th:if="${currentPage < totalPages}"
           th:href="@{/(page=${currentPage + 1})}">
            Next
        </a>

    </div>
</div>
<div class="container mt-5">
    <div class="mb-3">
        <a th:href="@{/employe/new}" class="btn btn-primary">
            Add Employee
        </a>
    </div>

</body>
</html>
